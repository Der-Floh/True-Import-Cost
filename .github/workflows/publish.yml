name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: vscode-extension-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: Florian-Noever/Florian-Noever/.github/workflows/vscode-extension-publish.yml@v1
    with:
      check-command: npm run ci:check
      test-command: npm run test:integration
      required-files: |
        out/extension.js
        out/parser.js
        out/standalone.js
        out/metadataWorker.js
        public/dashboard.js
        public/dashboard.css
        media/dashboard.html
        assets/icon-x512.png
        assets/activity-bar.svg
      vs-marketplace: true
      open-vsx: true
    secrets:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

  checksums:
    name: Attach checksums
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the VSIX from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir release

      - name: Write SHA256SUMS
        working-directory: release
        run: sha256sum -- *.vsix | tee SHA256SUMS

      - name: Attach SHA256SUMS to the release
        run: gh release upload "$TAG" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
